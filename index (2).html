<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050B14">
<title>SPLASH</title>
<style>
:root{
 --bg:#050B14; --deep:#081426; --card:#0C1826; --card2:#132436;
 --rule:#1B2E42; --rule2:#27405A;
 --ink:#E8F2F8; --sub:#8AA3B8; --hint:#54708A;
 --neon:#B4FF39; --neon-d:#5C8F1E; --neon-dd:#1E3010; --on-neon:#08160A;
 --foam:#EAF6FF;
 --c1:#FFFFFF; --c2:#20303F; --c3:#FF4A4A; --c4:#2E8BFF; --c5:#FFD029; --c6:#2BD97C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
 font-feature-settings:'tnum' 1;
 background:
   radial-gradient(120% 60% at 50% -10%, #102438 0%, transparent 60%),
   linear-gradient(180deg,#050B14 0%,#071120 40%,#050B14 100%);
 background-attachment:fixed;
 padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 68px)}
.wrap{max-width:440px;margin:0 auto;padding:0 13px}
.num{font-variant-numeric:tabular-nums}

/* ロゴ */
header{display:flex;align-items:center;gap:9px;padding:16px 0 10px}
.logo{position:relative;font-size:26px;font-weight:800;letter-spacing:-.02em;
 font-style:italic;color:var(--neon);line-height:1;
 text-shadow:0 0 18px rgba(180,255,57,.35)}
.logo::after{content:'';position:absolute;left:-7px;right:-9px;top:52%;height:3px;
 background:linear-gradient(90deg,transparent,var(--neon),transparent);opacity:.5;
 transform:skewY(-3deg)}
header .tag{font-size:9px;color:var(--hint);letter-spacing:.18em;
 border:1px solid var(--rule2);border-radius:3px;padding:2px 5px}
header select{margin-left:auto;font-size:15px;font-weight:600;padding:6px 9px;
 border:1px solid var(--rule2);border-radius:8px;background:var(--card2);
 color:var(--ink);font-family:inherit}

.dz{position:relative;border:1px dashed var(--rule2);border-radius:11px;padding:11px;
 text-align:center;background:var(--card);margin-bottom:8px;transition:.25s}
.dz.ok{border-style:solid;border-color:var(--neon-d);background:var(--card2)}
.dz.over{border-color:var(--neon);background:#132A10}
.dzt{font-size:12px;font-weight:600}
.dzs{font-size:11px;color:var(--hint);margin-top:3px;line-height:1.55}
.dz input{position:absolute;inset:0;opacity:0}

.bar{display:flex;gap:5px;align-items:center;margin-bottom:7px}
.vd{flex:1;font-size:11.5px;font-weight:600;padding:9px 0;text-align:center;
 border:1px solid var(--rule2);border-radius:9px;background:var(--card);
 color:var(--sub);font-family:inherit;transition:.15s}
.vd.on{background:var(--neon);border-color:var(--neon);color:var(--on-neon)}
.vd.dim{opacity:.3}

.meta{font-size:11px;color:var(--hint);text-align:center;margin-bottom:11px}
.meta b{color:var(--sub);font-weight:600}
.meta .rn{color:var(--neon);font-weight:700}

.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;
 padding:13px;margin-bottom:10px}
.card h2{margin:0 0 10px;font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--hint)}
.card h2 em{font-style:normal;color:var(--neon-d);margin-left:6px;letter-spacing:0;
 font-size:10px;font-weight:500}

/* 風の十字 */
.cross{display:grid;grid-template-columns:1fr 94px 1fr;gap:5px}
.wa{font-family:inherit;border:1px solid var(--rule2);border-radius:9px;background:var(--deep);
 color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:1px;padding:8px 4px;transition:.15s}
.wa .ar{font-size:15px;line-height:1}
.wa .wl{font-size:10px}
.wa.on{background:var(--neon-dd);border-color:var(--neon);color:var(--neon)}
.wa.na{opacity:.32}
.wa.up{grid-column:2;grid-row:1}
.wa.left{grid-column:1;grid-row:2}
.wa.right{grid-column:3;grid-row:2}
.wa.down{grid-column:2;grid-row:3}
.calmb{grid-column:3;grid-row:3;align-self:center;font-family:inherit;font-size:11px;
 padding:8px 4px;border-radius:9px;border:1px solid var(--rule2);background:var(--deep);color:var(--hint)}
.calmb.on{border-color:var(--neon);color:var(--neon);background:var(--neon-dd)}
.wc{grid-column:2;grid-row:2;display:flex;flex-direction:column;align-items:center;
 justify-content:center;border:1px solid var(--rule2);border-radius:9px;background:var(--card2);padding:6px 4px}
.wc input{width:58px;background:none;border:none;color:var(--ink);font-family:inherit;
 font-size:26px;font-weight:700;text-align:center;padding:0;font-variant-numeric:tabular-nums}
.wc input:focus{outline:none;color:var(--neon)}
.wu{font-size:10px;color:var(--hint);margin-top:-4px}
.tidebox{display:flex;gap:8px;align-items:center;margin-top:9px;
 border-top:1px solid var(--rule);padding-top:9px}
.tidebox .tin{display:flex;align-items:center;gap:4px;border:1px solid var(--rule2);
 border-radius:8px;background:var(--deep);padding:0 8px;height:36px}
.tidebox input{width:46px;background:none;border:none;color:var(--ink);font-family:inherit;
 font-size:16px;font-weight:600;text-align:right;padding:0;font-variant-numeric:tabular-nums}
.tidebox input:focus{outline:none;color:var(--neon)}
.tidebox span{font-size:10px;color:var(--hint)}

/* 進入 */
.shin{display:flex;gap:9px;align-items:center}
.shin input{width:124px;font-size:21px;font-weight:700;letter-spacing:.2em;padding:9px 6px;
 text-align:center;font-family:ui-monospace,Menlo,monospace;background:var(--deep);
 color:var(--ink);border:1px solid var(--rule2);border-radius:9px;font-variant-numeric:tabular-nums}
.shin input:focus{outline:none;border-color:var(--neon)}
.shin input.bad{border-color:#B4482A;color:#FF9A78}
.lineup{display:flex;gap:4px;margin-top:10px}
.lu{flex:1;border:1px solid var(--rule);border-radius:8px;padding:6px 2px;text-align:center;
 background:var(--deep);transition:.15s}
.lu .luc{font-size:9px;color:var(--hint);letter-spacing:.05em}
.lu .lub{width:22px;height:22px;border-radius:5px;margin:4px auto 2px;display:flex;
 align-items:center;justify-content:center;font-size:12px;font-weight:700}
.lu .lup{font-size:9px;color:var(--hint);height:12px}
.lu.moved{border-color:var(--neon-d);background:var(--neon-dd)}
.lu.moved .lup{color:var(--neon)}
.lu.kado{box-shadow:inset 0 0 0 1.5px var(--neon-d)}
.lu.kado .luc{color:var(--neon)}

/* 読み */
.reads{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.rd{border:1px solid var(--rule2);border-radius:9px;padding:10px 9px;background:var(--deep);
 text-align:left;font-family:inherit;transition:.18s}
.rd .rt{font-size:12.5px;color:var(--sub);font-weight:700}
.rd .rs{font-size:10px;color:var(--hint);margin-top:2px;line-height:1.4}
.rd.on{background:var(--neon-dd);border-color:var(--neon)}
.rd.on .rt{color:var(--neon)}.rd.on .rs{color:#A9D183}

/* シナリオ */
.sc{border-top:1px solid var(--rule);padding:11px 0 10px}
.sc:first-child{border-top:none;padding-top:2px}
.schead{display:flex;align-items:center;gap:9px}
.badge{width:23px;height:23px;border-radius:6px;display:flex;align-items:center;
 justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.sct{font-size:14px;font-weight:700;letter-spacing:.01em}
.scp{margin-left:auto;font-size:23px;font-weight:800;letter-spacing:-.03em;font-style:italic}
.sc.top .scp{color:var(--neon);text-shadow:0 0 14px rgba(180,255,57,.3)}
.scbar{height:7px;background:#0A1622;border-radius:4px;margin:7px 0 6px;overflow:hidden;position:relative}
.scbar i{display:block;height:100%;border-radius:4px;transition:width .4s cubic-bezier(.2,.8,.3,1)}
.scw{font-size:10.5px;color:var(--hint);line-height:1.55}
.sec{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.sec span{font-size:10.5px;padding:4px 7px;border-radius:6px;background:var(--card2);
 color:var(--sub);border:1px solid var(--rule)}
.sec span b{color:var(--ink);font-weight:700}
.sec span.hi{background:var(--neon-dd);border-color:var(--neon-d);color:#A9D183}
.sec span.hi b{color:var(--neon)}

/* 力 */
.pw{display:flex;align-items:center;border-top:1px solid var(--rule);padding:6px 0;gap:8px}
.pw:first-of-type{border-top:none}
.pwn{font-size:11.5px;width:60px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pwb{flex:1;height:7px;background:#0A1622;border-radius:4px;position:relative;overflow:hidden}
.pwb i{position:absolute;top:0;bottom:0;left:0;border-radius:4px}
.pwb u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--sub);opacity:.55}
.pwv{font-size:11.5px;width:34px;text-align:right;color:var(--sub);font-weight:600}
.pwe{font-size:9.5px;width:40px;text-align:right;color:var(--hint)}

.buy{display:grid;grid-template-columns:44px 1fr;gap:6px 9px;font-size:13.5px}
.buy .lb{color:var(--hint);font-size:11px;padding-top:2px;font-weight:600}
.buy .vl{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em;font-weight:600}
.buy .vl.hi{color:var(--neon)}
.skip{background:var(--neon-dd);border:1px solid var(--neon-d);color:#C9E8A0;border-radius:8px;
 padding:9px 11px;font-size:12px;margin-top:10px;line-height:1.55}

/* 入力 */
.tgrid{display:grid;grid-template-columns:25px 1.35fr 1fr 1fr 1fr;gap:5px;align-items:center}
.tgrid .gh{font-size:9.5px;color:var(--hint);text-align:center;font-weight:600}
.tgrid input{width:100%;min-width:0;font-size:13.5px;padding:8px 2px;text-align:center;
 font-family:inherit;background:var(--deep);color:var(--ink);border:1px solid var(--rule2);
 border-radius:7px;font-variant-numeric:tabular-nums}
.tgrid input:focus{outline:none;border-color:var(--neon);background:var(--card2)}
.tgrid input.auto{background:var(--card);color:var(--sub);border-style:dashed}
.tgrid input.bad{border-color:#B4482A;color:#FF9A78}
.pick{font-size:10.5px;color:var(--sub);padding-left:2px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.pick b{color:var(--neon-d);font-weight:700}.pick.err{color:#C4744F}
.note{font-size:10.5px;color:var(--hint);line-height:1.7;margin-top:11px}
.note code{color:var(--neon-d)}

/* R送り */
.rnav{position:fixed;left:0;right:0;bottom:0;z-index:40;
 background:linear-gradient(180deg,rgba(5,11,20,.5),rgba(5,11,20,.97) 40%);
 padding:9px 13px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
.rnav-in{max-width:440px;margin:0 auto;display:flex;gap:6px;align-items:center}
.rb{font-family:inherit;border:1px solid var(--rule2);border-radius:9px;background:var(--card2);
 color:var(--ink);font-size:14px;font-weight:700;padding:9px 0;flex:1}
.rb.mid{flex:2;background:var(--neon);color:var(--on-neon);border-color:var(--neon);
 font-size:15px;font-style:italic}
.rb:disabled{opacity:.28}
@media (prefers-reduced-motion:reduce){.scbar i{transition:none}}
</style>
</head>
<body><div class="wrap">

<header>
  <span class="logo">SPLASH</span><span class="tag">v2.0</span>
  <select id="race"></select>
</header>

<div class="dz" id="dz">
 <div class="dzt">番組表を読み込む</div>
 <div class="dzs" id="dzs">自動で読み込みます。手動なら、ここへドラッグ / タップして選択</div>
 <input type="file" id="bfile">
</div>
<div class="bar" id="venuebar"></div>
<div class="meta" id="meta"></div>

<div class="card">
 <h2>風<em id="windem"></em></h2>
 <div class="cross">
  <button class="wa up"    data-d="sideA"><span class="ar">&#9650;</span><span class="wl" id="wlA">横風</span></button>
  <button class="wa left"  data-d="head"><span class="ar">&#9664;</span><span class="wl">向かい風</span></button>
  <div class="wc"><input id="spd" type="text" inputmode="decimal" value="0"><span class="wu">m</span></div>
  <button class="wa right" data-d="tail"><span class="ar">&#9654;</span><span class="wl">追い風</span></button>
  <button class="wa down"  data-d="sideB"><span class="ar">&#9660;</span><span class="wl" id="wlB">横風</span></button>
  <button class="calmb" data-d="calm">無風</button>
 </div>
 <div class="tidebox" id="tidebox" style="display:none">
  <div class="tin"><input id="tide" type="text" inputmode="numeric"><span>cm</span></div>
  <div class="scw" id="tlab" style="flex:1"></div>
 </div>
 <div class="scw" id="windnote" style="margin-top:8px"></div>
</div>

<div class="card">
 <h2>進入<em>角の位置も決まります</em></h2>
 <div class="shin">
  <input type="text" id="shinnyu" inputmode="numeric" maxlength="6" placeholder="123456">
  <div class="scw" id="shinlab" style="flex:1"></div>
 </div>
 <div class="lineup" id="lineup"></div>
</div>

<div class="card">
 <h2>あなたの読み<em>両方押して比べる</em></h2>
 <div class="reads">
  <button class="rd" id="rdAtk"><div class="rt">角が攻める</div><div class="rs">まくると読むなら</div></button>
  <button class="rd" id="rdCalm"><div class="rt">角は攻めない</div><div class="rs">慎重・差し構えなら</div></button>
 </div>
 <div class="scw" id="readnote" style="margin-top:9px"></div>
</div>

<div class="card">
 <h2>シナリオ<em>決まり方と2着候補</em></h2>
 <div id="scen"></div>
</div>

<div class="card">
 <h2>6艇の力<em>そのコースでの1着率÷全国平均</em></h2>
 <div id="power"></div>
 <div class="scw" id="pwnote" style="margin-top:9px"></div>
</div>

<div class="card">
 <h2>買い目</h2>
 <div class="buy" id="buy"></div>
 <div id="skipbox"></div>
</div>

<div class="card">
 <h2>入力<em>直前情報から</em></h2>
 <div class="tgrid" id="tgrid"></div>
 <p class="note" id="dbnote"></p>
</div>
</div>

<div class="rnav"><div class="rnav-in">
 <button class="rb" id="rPrev">◀</button>
 <button class="rb mid" id="rNow">1R</button>
 <button class="rb" id="rNext">▶</button>
</div></div>
<script>
/* ============================================================
   番組表（Bファイル）パーサー — 固定長73文字
   ============================================================ */
const JCD={1:'桐生',2:'戸田',3:'江戸川',4:'平和島',5:'多摩川',6:'浜名湖',7:'蒲郡',
  8:'常滑',9:'津',10:'三国',11:'びわこ',12:'住之江',13:'尼崎',14:'鳴門',15:'丸亀',
  16:'児島',17:'宮島',18:'徳山',19:'下関',20:'若松',21:'芦屋',22:'福岡',23:'唐津',24:'大村'};

function parseB(text){
  const lines=text.replace(/\r\n/g,'\n').split('\n');
  const out={date:null,venues:{}};
  let jcd=null, cur=null, race=null;
  const numf=(s)=>{const v=parseFloat((s||'').trim());return isNaN(v)?null:v;};

  for(const raw of lines){
    let m=raw.match(/^(\d{2})BBGN/);
    if(m){ jcd=parseInt(m[1],10); cur={jcd,name:JCD[jcd]||String(jcd),races:{}};
           out.venues[jcd]=cur; race=null; continue; }
    if(/^\d{2}BEND/.test(raw)){ jcd=null;cur=null;race=null; continue; }
    if(!cur) continue;

    // 全角を半角に寄せてから解釈する
    const z=raw.replace(/[０-９]/g,c=>'0123456789'[c.charCodeAt(0)-0xFF10])
               .replace(/[Ｒｍ　：]/g,c=>({'Ｒ':'R','ｍ':'m','　':' ','：':':'}[c]))
               .replace(/Ｈ/g,'H');
    if(!out.date){
      const d=z.match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/);
      if(d) out.date=`${d[1]}-${String(+d[2]).padStart(2,'0')}-${String(+d[3]).padStart(2,'0')}`;
    }
    m=z.match(/^\s*(\d{1,2})R\s+(.*?)\s+H(\d+)m\s*(?:電話投票締切予定\s*([\d:]+))?/);
    if(m){
      race={no:parseInt(m[1],10), title:(m[2]||'').trim(),
            dist:parseInt(m[3],10),
            close:(m[4]||'').trim(), boats:[]};
      cur.races[race.no]=race; continue;
    }
    if(race && /^[1-6] \d{4}/.test(raw) && raw.length>=58){
      race.boats.push({
        lane:parseInt(raw[0],10),
        toban:raw.slice(2,6).trim(),
        name:raw.slice(6,10).replace(/\u3000/g,'').trim(),
        age:numf(raw.slice(10,12)),
        branch:raw.slice(12,14).trim(),
        weight:numf(raw.slice(14,16)),
        grade:raw.slice(16,18).trim(),
        natl:numf(raw.slice(18,23)), natl2:numf(raw.slice(23,29)),
        local:numf(raw.slice(29,34)), local2:numf(raw.slice(34,40)),
        motorNo:numf(raw.slice(40,43)), motor:numf(raw.slice(43,49)),
        boatNo:numf(raw.slice(49,52)), boat2:numf(raw.slice(52,58)),
        recent:raw.slice(58,70).trim()
      });
    }
  }
  for(const k in out.venues){
    const v=out.venues[k];
    v.raceList=Object.keys(v.races).map(Number).sort((a,b)=>a-b)
      .filter(n=>v.races[n].boats.length===6);
    if(!v.raceList.length) delete out.venues[k];
  }
  return out;
}

/* 今節成績 "5522" → 数値化。着順の平均（空欄・欠場は無視） */
function recentAvg(s){
  const v=(s||'').split('').filter(c=>c>='1'&&c<='6').map(Number);
  return v.length?{avg:v.reduce((a,x)=>a+x,0)/v.length, n:v.length}:null;
}

/* ============================================================
   SPLASH v2.0  係数
   3層構造:
     土台   会場×コースの1着分布（回帰の切片・489,762出走）
     個体差 回帰係数でスコアを作り6艇で正規化（交絡を潰した純粋な寄与）
     関係   風向・③起点・潮位。コース間の増減を直接足す（実測集計）
   ============================================================ */
const NATL=[55.4,14.0,12.5,10.7,5.9,1.9];

/* --- 土台 --- */
const VENUES={
 toda:    {key:'toda',    name:'戸田',  base:[47.0,15.8,16.6,15.2,7.2,2.8],
   note:'③の再配分が最大。①が最も薄い'},
 edogawa: {key:'edogawa', name:'江戸川',base:[50.8,18.5,14.1,13.0,6.7,3.0],
   note:'②が全場最高。潮位が高いと①が上がる'},
 naruto:  {key:'naruto',  name:'鳴門',  base:[52.9,15.4,14.2,11.6,7.5,2.3],
   note:'風速に素直。4m以上で①が急落'},
 karatsu: {key:'karatsu', name:'唐津',  base:[57.4,14.2,12.4,10.8,5.8,1.9],
   note:'①が堅い淡水プール。横風だけ牙を剥く'},
 kiryu:   {key:'kiryu',   name:'桐生',  base:[56.0,13.1,12.2,12.4,7.0,2.1],
   note:'向かい風で①が壊滅。③が強いと角が潰れる'},
 marugame:{key:'marugame',name:'丸亀',  base:[59.9,13.4,10.9,9.9,5.5,2.0],
   note:'①が最も堅い。満潮で①が落ちる'}
};

/* --- 個体差：回帰係数（対数オッズ）--- */
const W={ chikara:0.1495, touchi:0.1085, motor:0.0930, avgst:0.0970, konsetsu:0.3259,
          A1:0.1485, A2:0.0377, B1:-0.1880, oshidashi:0.1344,
          shinnyu_kotei:-0.0234, junyu:-0.4439, yusho:-0.3144, senbatsu:-0.2617 };
/* 力をコース別に標準化するための平均と標準偏差 */
const CSTAT=[[0.996,0.349],[1.022,0.728],[1.002,0.787],
             [0.999,0.847],[0.997,1.120],[1.010,1.987]];

/* --- 関係1：風向。コース別の増減ポイント（実測・無風または全体平均が基準）--- */
const WIND={

function spdGain(s){ return s<=0?0 : s<=2?1.0 : s<=4?1.45 : 1.9; }

/* --- 関係2：③起点。③の力で6コースに再配分（実測・6場とも約+10.5）--- */
const S3={span:[0.55,2.4],
 d:{toda:[-3.4,-0.9,11.2,-5.7,-0.7,-0.5], edogawa:[-2.1,-4.0,10.3,-3.4,-0.2,-0.7],
    naruto:[-2.2,-3.3,9.6,-3.1,-0.9,-0.2], karatsu:[-4.2,0.9,10.5,-5.1,-1.7,-0.4],
    kiryu:[3.0,-2.7,9.0,-6.6,-2.6,-0.2], marugame:[-3.9,-2.6,10.6,-2.3,-1.7,0.0]}};

/* --- 関係3：潮位。江戸川は交絡を除いた後の値、丸亀は実測どおり --- */
const TIDE={
 edogawa:{stn:'東京', q1:167, q3:225, d:[3.1,-2.4,0.6,-0.4,-0.7,-0.2], note:'交絡補正済み'},
 marugame:{stn:'高松', q1:157, q3:242, d:[-5.4,0.6,0.7,2.8,1.1,0.8], note:'3層で確認済み'}
};

/* --- 関係4：前づけの下駄（実測・コース別実績で説明できない残り）--- */
const PUSH=[0,-2.0,4.2,4.7,2.4,0];

const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));
const sig=z=>1/(1+Math.exp(-Math.max(-30,Math.min(30,z))));

function tideAdj(vk,cm){
  const t=TIDE[vk];
  if(!t||cm===null||isNaN(cm)) return null;
  let k=(cm-(t.q1+t.q3)/2)/(t.q3-t.q1);
  k=Math.max(-0.9,Math.min(0.9,k));
  return {adj:t.d.map(x=>x*k), k, t};
}
function windAdj(vk,dir,spd){
  const t=WIND[vk];
  if(!t||!dir||dir==='calm'||!spd) return {adj:[0,0,0,0,0,0],ok:true};
  const d=t[dir];
  if(!d) return {adj:[0,0,0,0,0,0],ok:false};
  const g=spdGain(spd);
  return {adj:d.map(x=>x*g),ok:true};
}

/* boats[c] = {rel, konsetsu, grade, touchi, motor, avgst, pushed, ent}
   c は 0..5 でコース順 */
function headDist(boats, ven, opt){
  const base=ven.base.slice();

  /* 関係：③起点 */
  const t3=Math.max(0,Math.min(1,(boats[2].rel-S3.span[0])/(S3.span[1]-S3.span[0])));
  const d3=S3.d[ven.key];
  for(let i=0;i<6;i++) base[i]+=d3[i]*(t3-0.5);

  /* 関係：風・潮 */
  const wa=windAdj(ven.key,opt.wdir,opt.spd);
  const ti=tideAdj(ven.key,opt.tide);
  for(let i=0;i<6;i++){
    base[i]+=wa.adj[i];
    if(ti) base[i]+=ti.adj[i];
  }

  /* 個体差：回帰でスコアを作る */
  const sc=boats.map((b,c)=>{
    let z=0;
    z+=W.chikara*((b.rel-CSTAT[c][0])/CSTAT[c][1]);
    if(b.touchi!=null) z+=W.touchi*((b.touchi-5.3)/1.5);
    if(b.motor!=null&&b.motor>0) z+=W.motor*((b.motor-34.0)/12.0);
    if(b.avgst!=null) z+=W.avgst*(-(b.avgst-0.166)/0.020);
    if(b.konsetsu!=null) z+=W.konsetsu*(-(b.konsetsu-3.4)/1.0);
    if(b.grade==='A1') z+=W.A1; else if(b.grade==='A2') z+=W.A2;
    else if(b.grade==='B1') z+=W.B1;
    if(b.pushed) z+=W.oshidashi;
    // レース名は全艇に同じだけ効くと正規化で消える。
    // 回帰が測ったのは「①が勝ちにくくなる」なので、①だけに効かせる。
    if(c===0){
      if(opt.title==='junyu') z+=W.junyu;
      else if(opt.title==='yusho') z+=W.yusho;
      else if(opt.title==='senbatsu') z+=W.senbatsu;
      else if(opt.title==='kotei') z+=W.shinnyu_kotei;
    }
    return z;
  });

  /* 土台をオッズに直して個体差を足し、6艇で正規化 */
  let v=base.map((p,c)=>{
    const p0=Math.max(0.005,Math.min(0.95,p/100));
    return sig(Math.log(p0/(1-p0))+sc[c]);
  });
  /* 前づけの下駄 */
  for(let c=0;c<6;c++) if(boats[c].pushed) v[c]*=1+PUSH[c]/100*3;
  const s=v.reduce((a,x)=>a+x,0);
  return {dist:v.map(x=>100*x/s), t3, windOK:wa.ok};
}

function scenarios(boats, ven, opt){
  const H=headDist(boats,ven,opt);
  let hh=H.dist.slice();
  if(opt.mode==='atk'){ hh[3]*=1.55; hh[4]*=1.15; hh[0]*=0.80; hh[1]*=0.88; }
  if(opt.mode==='calm'){ hh[3]*=0.55; hh[4]*=0.80; hh[0]*=1.18; hh[1]*=1.08; }
  const s=hh.reduce((a,x)=>a+x,0); hh=hh.map(x=>100*x/s);

  const t=H.t3;
  const n2=[35.4,21.6,21.6,14.2,7.3].map((x,i)=>lerp(x,[30.9,32.9,16.4,12.9,7.0][i],t));
  const sc=[
    {head:1,p:hh[0],title:'①逃げ',
     second:[2,3,4,5,6].map((c,i)=>({c,p:n2[i]})).sort((a,b)=>b.p-a.p),
     why:t>0.55?'2着は3コース。強いので2コースより前に出る':'2着は2コース。3コースが弱く順当'},
    {head:3,p:hh[2],title:'③まくり',
     second:[{c:1,p:38},{c:2,p:24},{c:4,p:20},{c:5,p:12},{c:6,p:6}],
     why:'外攻めの主役が3コース。1着の32%を占める'},
    {head:4,p:hh[3],title:'角まくり',
     second:[{c:5,p:28},{c:1,p:26},{c:3,p:20},{c:2,p:16},{c:6,p:10}],
     why:'角が攻めると5コースが付いてくる'},
    {head:2,p:hh[1],title:'②差し',
     second:[{c:1,p:34},{c:3,p:22},{c:4,p:20},{c:5,p:14},{c:6,p:10}],
     why:'1コースのスタート次第'},
    {head:5,p:hh[4],title:'⑤まくり差し',
     second:[{c:1,p:30},{c:3,p:24},{c:4,p:20},{c:2,p:16},{c:6,p:10}],
     why:'5コースの1着はまくり差しが54%'}
  ];
  return {dist:hh, sc:sc.sort((a,b)=>b.p-a.p), t3:t, windOK:H.windOK};
}

function normTitle(t){

function recentAvg2(s){
  const v=(s||'').split('').filter(c=>c>='1'&&c<='6').map(Number);

}
function shrink(rate,ent,c){

  const w=Math.min(1,ent/MINRUN);

}

      .sort((x,y)=>Math.abs(y.v)-Math.abs(x.v)).slice(0,3);
    const nm={head:'向かい風',tail:'追い風',sideA:'横風('+t.labA+')',sideB:'横風('+t.labB+')'}[wdir];
    $('windnote').innerHTML='<b style="color:var(--neon-d)">'+nm+spd+'m</b>　'+
      (big.length?big.map(x=>L[x.i]+(x.v>=0?'+':'')+x.v.toFixed(1)).join('　'):'大きな偏りは出ません');
  }
  // 潮
  const T=TIDE[vk];
  $('tidebox').style.display=T?'flex':'none';
  if(T){
    const a=tideAdj(vk,tideCm);
    $('tlab').innerHTML=a
      ? '<b style="color:var(--neon-d)">'+(a.k>0.15?'高い':a.k<-0.15?'低い':'標準')+'</b>　'+T.stn+
        '　①'+(a.adj[0]>=0?'+':'')+a.adj[0].toFixed(1)+'　角'+(a.adj[3]>=0?'+':'')+a.adj[3].toFixed(1)
      : T.stn+'の潮位　低&lt;'+T.q1+' 高&gt;'+T.q3+'cm';
  }
}
document.querySelectorAll('.wa').forEach(b=>{
  b.onclick=()=>{wdir=b.dataset.d;if(!spd){spd=2;$('spd').value='2';}syncWind();calc();};
});
document.querySelector('.calmb').onclick=()=>{wdir='calm';spd=0;$('spd').value='0';syncWind();calc();};
$('spd').oninput=()=>{const v=parseFloat($('spd').value);spd=isNaN(v)?0:v;
  if(spd>0&&wdir==='calm')wdir='tail';syncWind();calc();};
$('tide').oninput=()=>{const v=parseFloat($('tide').value);tideCm=isNaN(v)?null:v;syncWind();calc();};

$('shinnyu').oninput=()=>{
  const v=$('shinnyu').value.replace(/[^1-6]/g,'').slice(0,6);
  $('shinnyu').value=v;
  const ok=v.length===6&&new Set(v).size===6;
  $('shinnyu').classList.toggle('bad',v.length===6&&!ok);
  if(ok) shin=v.split('').map(Number); else if(!v.length) shin=[1,2,3,4,5,6];
  calc();
};
$('rdAtk').onclick=()=>{mode=mode==='atk'?null:'atk';syncRead();calc();};
$('rdCalm').onclick=()=>{mode=mode==='calm'?null:'calm';syncRead();calc();};
function syncRead(){
  $('rdAtk').classList.toggle('on',mode==='atk');
  $('rdCalm').classList.toggle('on',mode==='calm');
  $('readnote').textContent = mode==='atk'?'角が攻める前提。①逃げが下がり、角と⑤が前に出ます。'
    : mode==='calm'?'角は攻めない前提。①逃げが厚くなります。'
    : '両方押して比べてください。差が小さければ、そのレースで角の動きを読む必要はありません。';
}
syncRead();

function badge(n,i){return '<div class="badge" style="background:'+CC[i]+';color:'+CT[i]+
  (i===1?';border:1px solid #4A5F72':'')+'">'+n+'</div>';}
const tg=$('tgrid');
['','登番','ST','展示T','機力'].forEach(h=>{
  const d=document.createElement('div');d.className='gh';d.textContent=h;tg.appendChild(d);});
for(let i=0;i<6;i++){
  const bd=document.createElement('div');bd.innerHTML=badge(i+1,i);tg.appendChild(bd.firstChild);
  const t=document.createElement('input');
  t.type='text';t.inputMode='numeric';t.id='tb'+i;t.placeholder='登番';
  t.oninput=()=>{look(i);calc();};tg.appendChild(t);
  MAN.forEach((c,j)=>{const inp=document.createElement('input');
    inp.type='text';inp.inputMode='decimal';inp.id=c+i;
    inp.placeholder=['ST','展示','機力'][j];inp.oninput=calc;tg.appendChild(inp);});
  const pk=document.createElement('div');pk.className='pick';pk.id='pk'+i;
  pk.style.gridColumn='2 / span 4';tg.appendChild(pk);
}
$('dbnote').innerHTML='選手データ <b>'+DB.meta.period+'</b> '+Object.keys(DB.racers).length+
 '名。係数は先読み補正済みの実測（回帰489,762出走／実測集計36万レース）。'+
 '<code>角が攻める</code>の効き幅だけ未検証です。';

const BT={};
function look(i,bt){
  const el=$('tb'+i),pk=$('pk'+i),r=DB.racers[el.value.trim()];
  el.classList.toggle('bad',el.value.trim().length>0&&!r);
  if(bt) BT[i]=bt;
  if(!r){pk.className='pick'+(el.value.trim()?' err':'');pk.textContent=el.value.trim()?'該当なし':'';return;}
  const b2=BT[i];
  const s=shrink(r[6][i],r[7][i],i);
  pk.className='pick';
  pk.innerHTML=r[0]+'　'+r[1]+'　'+(i+1)+'ｺｰｽ'+r[6][i].toFixed(1)+'%('+r[7][i]+'走)　<b>力'+
    s.v.toFixed(2)+(s.w<1?'<span style="color:#C4744F">*</span>':'')+'</b>'+
    (b2?'　当地'+(b2.local!=null?b2.local.toFixed(2):'-')+(b2.recent?'　今節'+b2.recent:''):'');
  $('st'+i).placeholder=r[5].toFixed(2);
}

const dz=$('dz');
function readF(f){if(!f)return;const fr=new FileReader();
 fr.onload=()=>{let t=fr.result;
   if(!/BBGN/.test(t)){const f2=new FileReader();f2.onload=()=>apply(f2.result,f.name);
     f2.readAsText(f,'utf-8');return;} apply(t,f.name);};
 fr.readAsText(f,'shift_jis');}
function apply(txt,fn){
  let p;try{p=parseB(txt);}catch(e){p=null;}
  if(!p||!Object.keys(p.venues).length){
    $('dzs').innerHTML='<span style="color:#C4744F">読めませんでした</span>';return;}
  PROG=p;dz.classList.add('ok');
  const today=new Date().toISOString().slice(0,10);
  const stale=p.date&&p.date!==today;
  $('dz').querySelector('.dzt').textContent=stale?'番組表（日付を確認）':'番組表 読み込み済み';
  $('dzs').innerHTML='<b style="color:'+(stale?'#C4744F':'var(--neon)')+'">'+(p.date||fn)+'</b>'+
    (stale?' <span style="color:#C4744F">（今日は '+today+'）</span>':'')+'<br>'+
    Object.values(p.venues).map(v=>v.name).join('・');
  [...vb.querySelectorAll('.vd')].forEach(x=>x.classList.toggle('dim',!p.venues[VJCD[x.dataset.k]]));
  const f1=Object.keys(VJCD).find(k=>p.venues[VJCD[k]]);
  if(f1){vk=f1;[...vb.querySelectorAll('.vd')].forEach(x=>x.classList.toggle('on',x.dataset.k===vk));}
  syncWind();fill();
}
dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
dz.ondragleave=()=>dz.classList.remove('over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');readF(e.dataTransfer.files[0]);};
$('bfile').onchange=e=>readF(e.target.files[0]);

let curTitle='yosen';
function fill(){
  if(!PROG)return;
  const v=PROG.venues[VJCD[vk]];
  if(!v){$('meta').textContent='この日 '+VENUES[vk].name+' は開催なし';return;}
  const R=v.races[+sel.value];
  if(!R){$('meta').textContent='';return;}
  curTitle=normTitle(R.title);
  const TN={junyu:'準優勝戦',yusho:'優勝戦',senbatsu:'選抜',kotei:'進入固定',yosen:''}[curTitle];
  $('meta').innerHTML=v.name+' <span class="rn">'+R.no+'R</span>　<b>'+R.title+'</b>　'+
    R.dist+'m　締切 <b>'+R.close+'</b>'+
    (TN?'　<span style="color:var(--neon-d)">'+TN+'は①が不利</span>':'');
  shin=[1,2,3,4,5,6];$('shinnyu').value='';
  R.boats.forEach((bt,i)=>{
    $('tb'+i).value=bt.toban;
    const mo=$('motor'+i);
    if(bt.motor>0){mo.value=bt.motor.toFixed(1);mo.classList.add('auto');}
    else{mo.value='';mo.classList.remove('auto');}
    $('st'+i).value='';$('tenji'+i).value='';
    look(i,bt);
  });
  calc();
}

function drawLineup(){
  const lu=$('lineup');lu.innerHTML='';
  const moved=shin.some((b,c)=>b!==c+1);
  for(let c=0;c<6;c++){
    const ln=shin[c],diff=ln-(c+1);
    const d=document.createElement('div');
    d.className='lu'+(diff!==0?' moved':'')+(c===3?' kado':'');
    d.innerHTML='<div class="luc">'+(c===3?'角':(c+1)+'ｺｰｽ')+'</div>'+
      '<div class="lub" style="background:'+CC[ln-1]+';color:'+CT[ln-1]+
      (ln===2?';border:1px solid #4A5F72':'')+'">'+ln+'</div>'+
      '<div class="lup">'+(diff>0?'内'+diff:diff<0?'外'+(-diff):'')+'</div>';
    lu.appendChild(d);
  }
  $('shinlab').innerHTML=moved
    ? '<b style="color:var(--neon)">枠なりではありません。</b>実際に走るコースの実績で計算しています。'
    : '枠なり。変更があれば進入順に6桁で（例 152346）。';
}

function calc(){
  const raw=[];
  for(let i=0;i<6;i++){
    const r=DB.racers[$('tb'+i).value.trim()];
    if(!r){$('scen').innerHTML='<div class="scw">登番を6つ入れてください</div>';return;}
    raw.push(r);
  }
  drawLineup();
  const boats=[],lane=[],thin=[];
  for(let c=0;c<6;c++){
    const ln=shin[c]-1, r=raw[ln], bt=BT[ln];
    const s=shrink(r[6][c],r[7][c],c);
    const stv=parseFloat($('st'+ln).value), tj=parseFloat($('tenji'+ln).value),
          mo=parseFloat($('motor'+ln).value);
    boats.push({rel:s.v, grade:r[1], avgst:r[5],
      touchi:bt&&bt.local>0?bt.local:null,
      motor:isNaN(mo)?(bt&&bt.motor>0?bt.motor:null):mo,
      konsetsu:bt?recentAvg2(bt.recent):null,
      pushed:(ln+1)<(c+1), ent:r[7][c],
      st:isNaN(stv)?null:stv, tenji:isNaN(tj)?null:tj});
    lane.push(ln+1); thin.push(s.w<1);
  }
  const ven=VENUES[vk];
  const R=scenarios(boats,ven,{wdir,spd,tide:tideCm,mode,title:curTitle});
  const L=c=>lane[c-1];

  const sc=$('scen');sc.innerHTML='';
  R.sc.forEach((s,k)=>{
    const ln=L(s.head)-1;
    const d=document.createElement('div');d.className='sc'+(k===0?' top':'');
    d.innerHTML='<div class="schead">'+badge(L(s.head),ln)+
      '<span class="sct">'+s.title+'</span>'+
      '<span class="scp num">'+s.p.toFixed(1)+'%</span></div>'+
      '<div class="scbar"><i style="width:'+Math.min(100,s.p*1.8).toFixed(0)+'%;background:'+
        (k===0?'var(--neon)':CC[ln])+'"></i></div>'+
      '<div class="scw">'+s.why+'</div>'+
      '<div class="sec">'+s.second.slice(0,4).map((x,j)=>
        '<span'+(j===0?' class="hi"':'')+'>2着 <b>'+L(x.c)+'</b> '+x.p.toFixed(0)+'%</span>').join('')+'</div>';
    sc.appendChild(d);
  });

  const pw=$('power');pw.innerHTML='';
  boats.forEach((b,c)=>{
    const ln=lane[c]-1, w=Math.min(100,b.rel/2.5*100);
    const d=document.createElement('div');d.className='pw';
    d.innerHTML=badge(lane[c],ln)+
      '<div class="pwn">'+raw[ln][0]+'</div>'+
      '<div class="pwb"><i style="width:'+w.toFixed(0)+'%;background:'+CC[ln]+'"></i><u style="left:40%"></u></div>'+
      '<div class="pwv num">'+b.rel.toFixed(2)+'</div>'+
      '<div class="pwe num">'+(thin[c]?'<span style="color:#C4744F">'+b.ent+'走</span>':(c+1)+'ｺｰｽ')+'</div>';
    pw.appendChild(d);
  });
  const t=R.t3;
  $('pwnote').innerHTML='3ｺｰｽ('+lane[2]+'号艇)の力 '+boats[2].rel.toFixed(2)+' → '+
    (t>0.6?'<b style="color:var(--neon)">3ｺｰｽが主役。</b>①逃げでも2着はここ'
     :t<0.35?'<b>3ｺｰｽは弱い。</b>外攻めは角('+lane[3]+'号艇)の役目'
     :'3ｺｰｽは中間。①逃げと3ｺｰｽまくりの二択')+'　｜　縦線が平均(1.0)';

  const top=R.sc[0],sec2=R.sc[1];
  const h=L(top.head),s1=top.second.slice(0,3).map(x=>L(x.c));
  const h2=L(sec2.head),s2=sec2.second.slice(0,3).map(x=>L(x.c));
  $('buy').innerHTML=
   '<span class="lb">本命</span><span class="vl">'+h+'-'+s1.join('')+'-全</span>'+
   '<span class="lb">対抗</span><span class="vl hi">'+h2+'-'+s2.join('')+'-全</span>'+
   '<span class="lb">2軸</span><span class="vl">'+h+'='+h2+'-全</span>'+
   '<span class="lb">BOX</span><span class="vl">'+[h,h2,s1[0]].filter((x,i,a)=>a.indexOf(x)===i).join('')+'BOX</span>';

  const gap=top.p-sec2.p;
  let msg='';
  if(!R.windOK&&spd>0) msg='この会場のこの風向はデータ不足のため、補正をかけていません。';
  else if(thin.some(x=>x)) msg='走行数の少ない艇は力を平均寄りに補正しています（*印）。';
  else if(gap<6) msg='上位2つの差が'+gap.toFixed(1)+'ポイント。展開が読み切れません。2軸か見送り。';
  else if(spd>=5) msg='風速5m以上。'+ven.name+'のこの風向では偏りが大きく出ます。';
  $('skipbox').innerHTML=msg?'<div class="skip">'+msg+'</div>':'';
}

async function autoLoad(){
  for(const n of ['bangumi.txt','today/bangumi.txt']){
    try{
      const res=await fetch(n+'?t='+Date.now());
      if(!res.ok) continue;
      const buf=await res.arrayBuffer();
      let txt;
      try{txt=new TextDecoder('shift_jis').decode(buf);}catch(e){txt=null;}
      if(!txt||!/BBGN/.test(txt)) txt=new TextDecoder('utf-8').decode(buf);
      if(/BBGN/.test(txt)){apply(txt,n);return true;}
    }catch(e){}
  }
  return false;
}
syncWind();
autoLoad().then(f=>{if(!f)$('scen').innerHTML='<div class="scw">番組表を読み込んでください</div>';});

</script>
