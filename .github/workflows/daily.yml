name: bangumi

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install lha
        run: sudo apt-get update && sudo apt-get install -y lhasa

      - name: fetch bangumi
        run: |
          set -e
          TODAY=$(TZ=Asia/Tokyo date +%y%m%d)
          YM=$(TZ=Asia/Tokyo date +%Y%m)
          echo "target: $TODAY"
          URL="http://www1.mbrace.or.jp/od2/B/${YM}/b${TODAY}.lzh"
          echo "url: $URL"
          curl -sfL -o b.lzh "$URL" || curl -sfL -o b.lzh "http://www1.mbrace.or.jp/od2/B/${YM}/B${TODAY}.lzh"
          ls -l b.lzh
          lhasa e b.lzh
          ls -l
          mv "b${TODAY}.txt" bangumi.txt 2>/dev/null || mv "B${TODAY}.TXT" bangumi.txt
          wc -c bangumi.txt
          rm -f b.lzh

      - name: commit
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add bangumi.txt
          git diff --staged --quiet || git commit -m "bangumi $(TZ=Asia/Tokyo date +%F)"
          git push
