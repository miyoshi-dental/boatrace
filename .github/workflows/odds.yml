name: odds
on:
  schedule:
    - cron: '40 14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (empty = today)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch odds
        run: |
          mkdir -p odds
          python tools/odds_daily.py --date "${{ github.event.inputs.date }}"
          ls -l odds/
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A odds
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "odds ${{ github.event.inputs.date }}"
            git pull --rebase
            git push
          fi
